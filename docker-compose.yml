services:
  app:
    image: registry.adrienfdupont.com/adrien/melika:latest
    restart: unless-stopped
    container_name: melika-app
    depends_on:
      - redis
    networks:
      - npm
      - default
  redis:
    image: redis:alpine
    restart: unless-stopped
    container_name: melika-redis
    volumes:
      - ./redis-data:/data

networks:
  npm:
    external: true
